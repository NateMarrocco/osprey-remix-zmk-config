CONFIG_ZMK_KEYBOARD_NAME="Osprey"
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_DISPLAY=n
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Power management — re-enabled, this was likely tripping battery protection
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# Lets the dongle (central) fetch and re-report the keyboard's (peripheral's)
# real battery level over BLE GATT, so it can be read while genuinely running
# on battery — as opposed to reading the keyboard nano's own value right after
# a USB touch, which reads charging voltage and always shows ~100% regardless
# of true battery state.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# TX power — dropped back to default (was +8dBm, unnecessary current draw)
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Balanced debounce - fast but no double keys
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Low latency BLE settings — relaxed slightly to allow radio idle between events
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

# The above CONFIG_BT_PERIPHERAL_PREF_* settings only apply when connecting
# directly to a normal BLE host (e.g. Windows). When using a ZMK dongle as
# Central, the dongle instead uses CONFIG_ZMK_SPLIT_BLE_PREF_* to set the
# split central<->peripheral connection params — these were previously unset
# and defaulting to a 7.5ms interval (ZMK_SPLIT_BLE_PREF_INT default of 6),
# roughly double the radio wake-up rate intended above. Setting explicitly
# here to match the same ~15ms interval and reduce keyboard-side current draw.
CONFIG_ZMK_SPLIT_BLE_PREF_INT=12
CONFIG_ZMK_SPLIT_BLE_PREF_LATENCY=10
CONFIG_ZMK_SPLIT_BLE_PREF_TIMEOUT=400

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Death diagnostics — reset-cause logging + watchdog auto-recovery
CONFIG_LOG=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
