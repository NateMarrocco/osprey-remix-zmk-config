CONFIG_ZMK_KEYBOARD_NAME="Osprey"
CONFIG_ZMK_BLE=y
CONFIG_ZMK_USB=y
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_DISPLAY=n
CONFIG_BT_MAX_CONN=3
CONFIG_BT_MAX_PAIRED=3
CONFIG_ZMK_BLE_PASSKEY_ENTRY=n

# Power management — re-enabled, this was likely tripping battery protection
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y

CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=n
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=300

# TX power — dropped back to default (was +8dBm, unnecessary current draw)
# CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Balanced debounce - fast but no double keys
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5
CONFIG_USB_HID_POLL_INTERVAL_MS=1

# Low latency BLE settings — relaxed slightly to allow radio idle between events
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=12
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=10
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=400
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y

CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# Death diagnostics — reset-cause logging + watchdog auto-recovery
CONFIG_LOG=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=4000
